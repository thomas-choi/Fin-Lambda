[pytest]
# fin-deep-data has its own pytest root, separate from the repo-root pytest.ini.
#
# Both Ops/fin-cron-data and Ops/fin-deep-data contain a module named dataUtil
# (and port_assets_handler), so the two folders can never be on sys.path in one
# session: `import dataUtil` would resolve to whichever came first and the tests
# would silently check the wrong copy. Hence two roots, two commands:
#
#   cd Ops/fin-deep-data && ../../venv-py313/bin/python -m pytest tests/unit -v
#   cd ../..             && venv-cron7/bin/python -m pytest tests/unit -v
#
# The repo-root config collects `tests/` only, so it never reaches this tree.
testpaths = tests

# Handlers use flat imports (`import dataUtil as DU`) with no package, so the
# service folder itself has to be importable.
pythonpath = .

addopts = -ra --strict-markers

markers =
    unit: fast, hermetic. Never touches the network, MySQL, S3/R2 or Yahoo.
    integration: hits a live external source. Opt-in, run manually: pytest -m integration

# DeprecationWarning is ignored wholesale here, as at the repo root, because the
# dependencies emit plenty. Our own modules are held to a stricter standard by
# the verification command in doc/OPERATIONS.md, which re-runs the suite with
# -W error::FutureWarning:<module> -W error::DeprecationWarning:<module>.
filterwarnings =
    ignore::DeprecationWarning
