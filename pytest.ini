[pytest]
testpaths = tests

# Handlers use flat imports (`import dataUtil as DU`) with no package, so the
# handler directory has to be importable directly. See TODOS.md section 0.2.
pythonpath = Ops/fin-cron-data

addopts = -ra --strict-markers

markers =
    unit: fast, hermetic. Never touches the network, MySQL, S3/R2 or the DDS socket.
    integration: hits a live external source. Opt-in, run manually: pytest -m integration

filterwarnings =
    ignore::DeprecationWarning
